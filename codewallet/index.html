  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgMain: '#F5F1E8',
            greyMuted: '#4A4A47',
            greyBorder: '#4A4A47',
            textMain: '#4A4A47',
            recessedBg: '#E5E1D6',
            greySelectedText: '#6B7280',
          }
        }

  </script>
  
  <style>
    /* Global Base Reset & Fonts */
    body {
      background-color: #F5F1E8;
      color: #4A4A47;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Scrollbar Hiding for Horizontal Store Navigation */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Dynamic Store Tab Styling according to Spec */
    /* Selected tab: Rice white #F5F1E8 bg + grey text, NO border -> blends with content below */
    .store-tab-active {
      background-color: #F5F1E8 !important;
      color: #4A4A47 !important;
      border: none !important;
      font-weight: 700;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.03);
    }
    /* Unselected tab: Muted grey #4A4A47 bg + Rice white text, NO border */
    .store-tab-inactive {
      background-color: #4A4A47 !important;
      color: #F5F1E8 !important;
      border: none !important;
      font-weight: 500;
      opacity: 0.9;
    }
    
    /* Segmented Control Transition */
    .segmented-pill {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Safe Area Adaptability for iOS & Modern Smartphones */
    .safe-container {
      padding-top: max(0.5rem, env(safe-area-inset-top));
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
    }
  </style>
  <script>
    // Extra safety net: some browsers (notably iOS Safari) can still allow
    // pinch-zoom gestures even with user-scalable=no in the viewport meta tag.
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
  </script>

  <!-- Backup Reminder Toast (非阻擋式提示，新增店家後短暫顯示) -->

        ✕

  <script>
    /* Global Storage Key & Initial Preset Data */
    const STORAGE_KEY = 'pwa_barcode_wallet_v2';

    // Preset Default Data
    const defaultData = {
      carrier: "",
      carrierType: "CODE39",
      stores: []
    };

    // Application State Variables
    let appData = loadAppData();
    let selectedStoreId = appData.stores.length > 0 ? appData.stores[0].id : null;
    let lastParsedScan = null;

    /* Load / Save Helpers */
    function loadAppData() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && Array.isArray(parsed.stores)) {
            return parsed;
          }
        }
      } catch (e) {
        console.error("Failed to load local storage:", e);
      }
      return defaultData;
    }

    function saveAppData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      } catch (e) {
        console.error("Failed to save to local storage:", e);
      }
    }

    // Render Mobile Carrier Barcode
    function renderCarrierBarcode() {
      const carrierSvg = document.getElementById('carrier-barcode-svg');
      const carrierText = document.getElementById('carrier-display-text');
      const carrierEmptyState = document.getElementById('carrier-empty-state');
      const carrierValue = (appData.carrier || '').trim();

      if (carrierText) carrierText.innerText = carrierValue || "尚未設定";

      if (!carrierValue) {
        // No carrier code set yet: show prompt instead of a fallback barcode
        if (carrierSvg) {
          carrierSvg.classList.add('hidden');
          carrierSvg.innerHTML = '';
        }
        if (carrierEmptyState) carrierEmptyState.classList.remove('hidden');
        return;
      }

      if (carrierEmptyState) carrierEmptyState.classList.add('hidden');
      if (carrierSvg) carrierSvg.classList.remove('hidden');

      try {
        JsBarcode("#carrier-barcode-svg", carrierValue, {
          format: appData.carrierType || "CODE39",
          width: 2.2,
          height: 75,
          displayValue: true,
          fontSize: 12,
          margin: 6,
          background: "#ffffff",
          lineColor: "#000000"
        });
      } catch (err) {
        console.warn("Carrier barcode render error, fallback to CODE128:", err);
        try {
          JsBarcode("#carrier-barcode-svg", carrierValue, {
            format: "CODE128",
            width: 1.8,
            height: 45,
            displayValue: true,
            fontSize: 10,
            margin: 4
          });
        } catch(e){}
      }
    }

    // Prompt user to edit Mobile Carrier code on the fly
    function editCarrierCode() {
      const newCode = prompt("請輸入您的手機通用載具條碼（含前導斜線 /）：", appData.carrier);
      if (newCode !== null && newCode.trim() !== "") {
        appData.carrier = newCode.trim().toUpperCase();
        saveAppData();
        renderCarrierBarcode();
      }
    }

    // Render Store Navbar
    function renderStoreNav() {
      const navContainer = document.getElementById('store-nav-container');
      if (!navContainer) return;

      navContainer.innerHTML = '';

      appData.stores.forEach((store) => {
        const isSelected = store.id === selectedStoreId;
        const btn = document.createElement('button');
        
        btn.className = `px-4 py-2.5 text-sm rounded-lg whitespace-nowrap transition-all duration-150 shrink-0 ${
          isSelected ? 'store-tab-active' : 'store-tab-inactive'
        }`;
        
        btn.innerText = store.storeName;
        btn.onclick = () => selectStore(store.id);
        navContainer.appendChild(btn);
      });

      // Render Add Store Button at the end of Navbar
      const addBtn = document.createElement('button');
      addBtn.className = "px-3 py-2.5 text-sm rounded-lg whitespace-nowrap bg-[#E5E1D6] text-[#4A4A47] hover:bg-[#4A4A47] hover:text-white shrink-0 font-bold transition-colors";
      addBtn.innerHTML = '<i class="fa-solid fa-plus mr-1"></i>新增';
      addBtn.onclick = () => openStoreManageModal(null);
      navContainer.appendChild(addBtn);
    }

    function selectStore(storeId) {
      selectedStoreId = storeId;
      renderStoreNav();
      renderCurrentStoreContent();
      
      // Auto center selected tab in scrollable row
      const navContainer = document.getElementById('store-nav-container');
      const index = appData.stores.findIndex(s => s.id === storeId);
      if (navContainer && index >= 0) {
        const childBtn = navContainer.children[index];
        if (childBtn) {
          childBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      }
    }

    // Render Selected Store Details, Barcode & Notice
    function renderCurrentStoreContent() {
      const noStoreState = document.getElementById('no-store-state');
      const storeContentWrapper = document.getElementById('store-content-wrapper');
      const noticeBox = document.getElementById('notice-box');

      if (appData.stores.length === 0) {
        // No stores at all: show the dedicated "add your first store" prompt
        if (noStoreState) noStoreState.classList.remove('hidden');
        if (storeContentWrapper) storeContentWrapper.classList.add('hidden');
        if (noticeBox) noticeBox.classList.add('hidden');
        return;
      }

      if (noStoreState) noStoreState.classList.add('hidden');
      if (storeContentWrapper) storeContentWrapper.classList.remove('hidden');
      if (noticeBox) noticeBox.classList.remove('hidden');

      const store = appData.stores.find(s => s.id === selectedStoreId);
      if (!store) return;

      // Update Store Name Header
      document.getElementById('current-store-name').innerText = store.storeName;

      const linearWrapper = document.getElementById('linear-barcode-wrapper');
      const qrWrapper = document.getElementById('qr-barcode-wrapper');
      const emptyState = document.getElementById('empty-barcode-state');
      const barcodeValueText = document.getElementById('barcode-value-text');
      const qrCanvasContainer = document.getElementById('qrcode-canvas-container');

      let targetValue = store.barcodeValue;
      let targetType = store.barcodeType || 'CODE128';

      // Hide all wrappers initially
      linearWrapper.classList.add('hidden');
      qrWrapper.classList.add('hidden');
      emptyState.classList.add('hidden');
      barcodeValueText.innerText = '';

      if (!targetValue || targetValue.trim() === '') {
        // Show empty state prompt
        emptyState.classList.remove('hidden');
      } else {
        barcodeValueText.innerText = targetValue;

        if (targetType === 'QR_CODE') {
          qrWrapper.classList.remove('hidden');
          qrCanvasContainer.innerHTML = ''; // clear previous QR Code
          try {
            new QRCode(qrCanvasContainer, {
              text: targetValue,
              width: 150,
              height: 150,
              colorDark : "#000000",
              colorLight : "#ffffff",
              correctLevel : QRCode.CorrectLevel.M
            });
          } catch (e) {
            console.error("QR Code generation error:", e);
          }
        } else {
          linearWrapper.classList.remove('hidden');
          try {
            JsBarcode("#store-barcode-svg", targetValue, {
              format: targetType,
              width: 2,
              height: 70,
              displayValue: false, // Card value shown in dedicated text div below
              margin: 10,
              background: "#ffffff",
              lineColor: "#000000"
            });
          } catch (e) {
            console.warn(`Fallback rendering CODE128 for ${targetValue}`, e);
            try {
              JsBarcode("#store-barcode-svg", targetValue, {
                format: "CODE128",
                width: 2,
                height: 70,
                displayValue: false,
                margin: 10
              });
            } catch(err){}
          }
        }
      }

      // Update Dynamic Notice Warning
      const noticeDynamic = document.getElementById('notice-dynamic-text');
      if (noticeDynamic) {
        noticeDynamic.innerText = `${store.storeName}，會員條碼`;
      }
    }

    /* Barcode Scanner & Image Decoder Functions */
    let scanApplyMode = 'quick'; // 'quick' = write directly to currently selected store; 'form' = fill back into the store form fields

    function openScanModal(mode = 'quick') {
      scanApplyMode = mode;
      document.getElementById('scan-result-box').classList.add('hidden');
      document.getElementById('scan-modal').classList.remove('hidden');
    }

    function closeScanModal() {
      document.getElementById('scan-modal').classList.add('hidden');
    }

    // Process image file input via ZXing library
    async function handleImageScan(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const imageUrl = e.target.result;
        decodeBarcodeFromImageSrc(imageUrl);
      };
      reader.readAsDataURL(file);
    }

    // Decode Image Source using ZXing or BarcodeDetector API
    async function decodeBarcodeFromImageSrc(src) {
      const resultBox = document.getElementById('scan-result-box');
      const resultText = document.getElementById('scan-result-text');
      const resultType = document.getElementById('scan-result-type');

      try {
        // Option A: Try ZXing BrowserMultiFormatReader
        if (window.ZXing) {
          const codeReader = new ZXing.BrowserMultiFormatReader();
          const img = new Image();
          img.src = src;
          img.onload = async () => {
            try {
              const result = await codeReader.decodeFromImageElement(img);
              if (result) {
                lastParsedScan = {
                  value: result.getText(),
                  format: mapZXingFormatToType(result.getBarcodeFormat())
                };
                resultText.innerText = lastParsedScan.value;
                resultType.innerText = `格式: ${lastParsedScan.format}`;
                resultBox.classList.remove('hidden');
                return;
              }
            } catch (err) {
              console.warn("ZXing decode attempt failed:", err);
              fallbackNativeDetector(img);
            }
          };
        } else {
          const img = new Image();
          img.src = src;
          img.onload = () => fallbackNativeDetector(img);
        }
      } catch (err) {
        alert("無法讀取條碼照片，請嘗試手動輸入。");
      }
    }

    // Native BarcodeDetector Fallback
    async function fallbackNativeDetector(img) {
      const resultBox = document.getElementById('scan-result-box');
      const resultText = document.getElementById('scan-result-text');
      const resultType = document.getElementById('scan-result-type');

      if ('BarcodeDetector' in window) {
        try {
          const detector = new BarcodeDetector();
          const barcodes = await detector.detect(img);
          if (barcodes && barcodes.length > 0) {
            lastParsedScan = {
              value: barcodes[0].rawValue,
              format: barcodes[0].format.toUpperCase().includes('QR') ? 'QR_CODE' : 'CODE128'
            };
            resultText.innerText = lastParsedScan.value;
            resultType.innerText = `格式: ${lastParsedScan.format}`;
            resultBox.classList.remove('hidden');
            return;
          }
        } catch (e) {
          console.warn("Native BarcodeDetector failed:", e);
        }
      }
      alert("無法自動辨識圖檔中的條碼，請手動輸入卡號。");
    }

    function mapZXingFormatToType(formatInt) {
      // Basic ZXing format mapper
      if (formatInt === 11 || formatInt === 'QR_CODE') return 'QR_CODE';
      if (formatInt === 5 || formatInt === 'EAN_13') return 'EAN13';
      if (formatInt === 4 || formatInt === 'EAN_8') return 'EAN8';
      if (formatInt === 3 || formatInt === 'CODE_39') return 'CODE39';
      return 'CODE128';
    }

    // iOS Safari & Mobile Clipboard Paste Helper
    async function handleClipboardPaste() {
      try {
        const text = await navigator.clipboard.readText();
        if (text && text.trim() !== '') {
          lastParsedScan = {
            value: text.trim(),
            format: text.trim().length > 20 ? 'QR_CODE' : 'CODE128'
          };
          document.getElementById('scan-result-text').innerText = lastParsedScan.value;
          document.getElementById('scan-result-type').innerText = `剪貼簿內容 (預設: ${lastParsedScan.format})`;
          document.getElementById('scan-result-box').classList.remove('hidden');
        } else {
          alert("剪貼簿中無可用的文字卡號內容");
        }
      } catch (err) {
        alert("無法讀取剪貼簿，請確認權限或嘗試手動貼上。");
      }
    }

    function applyScanResult() {
      if (!lastParsedScan) return;

      if (scanApplyMode === 'form') {
        // Fill the result back into the store form fields; user still needs to press "儲存"
        document.getElementById('input-member-code').value = lastParsedScan.value;
        document.getElementById('input-member-type').value = lastParsedScan.format;
        closeScanModal();
        return;
      }

      // Quick mode: write directly to the currently selected store
      if (!selectedStoreId) return;
      const store = appData.stores.find(s => s.id === selectedStoreId);
      if (!store) return;

      store.barcodeValue = lastParsedScan.value;
      store.barcodeType = lastParsedScan.format;

      saveAppData();
      closeScanModal();
      renderCurrentStoreContent();
    }

    /* Store Management Modal Functions */
    function openStoreManageModal(storeId = selectedStoreId) {
      const modal = document.getElementById('store-modal');
      const deleteBtn = document.getElementById('delete-store-btn');
      const title = document.getElementById('modal-title');

      if (storeId) {
        const store = appData.stores.find(s => s.id === storeId);
        if (store) {
          document.getElementById('edit-store-id').value = store.id;
          document.getElementById('input-store-name').value = store.storeName;
          document.getElementById('input-member-code').value = store.barcodeValue || '';
          document.getElementById('input-member-type').value = store.barcodeType || 'CODE128';
          title.innerText = "編輯店家條碼";
          deleteBtn.classList.remove('hidden');
        }
      } else {
        // Add new store
        document.getElementById('edit-store-id').value = '';
        document.getElementById('input-store-name').value = '';
        document.getElementById('input-member-code').value = '';
        document.getElementById('input-member-type').value = 'CODE128';
        title.innerText = "新增店家卡片";
        deleteBtn.classList.add('hidden');
      }

      modal.classList.remove('hidden');
    }

    function closeStoreModal() {
      document.getElementById('store-modal').classList.add('hidden');
    }

    /* Backup Reminder Toast Functions */
    let backupToastTimer = null;

    function showBackupReminderToast() {
      const toast = document.getElementById('backup-reminder-toast');
      if (!toast) return;

      toast.classList.remove('hidden');

      // Reset auto-dismiss timer each time it's shown
      if (backupToastTimer) clearTimeout(backupToastTimer);
      backupToastTimer = setTimeout(() => {
        dismissBackupReminderToast();
      }, 6000);
    }

    function dismissBackupReminderToast() {
      const toast = document.getElementById('backup-reminder-toast');
      if (toast) toast.classList.add('hidden');
      if (backupToastTimer) {
        clearTimeout(backupToastTimer);
        backupToastTimer = null;
      }
    }

    function saveStoreData() {
      const editId = document.getElementById('edit-store-id').value;
      const storeName = document.getElementById('input-store-name').value.trim();
      const memberCode = document.getElementById('input-member-code').value.trim();
      const memberType = document.getElementById('input-member-type').value;

      if (!storeName) {
        alert("請輸入店家名稱");
        return;
      }

      const isNewStore = !editId;

      if (editId) {
        // Update existing store
        const store = appData.stores.find(s => s.id === editId);
        if (store) {
          store.storeName = storeName;
          store.barcodeValue = memberCode;
          store.barcodeType = memberType;
        }
      } else {
        // Create new store
        const newId = "store-" + Date.now();
        const newStore = {
          id: newId,
          order: appData.stores.length + 1,
          storeName: storeName,
          barcodeValue: memberCode,
          barcodeType: memberType
        };
        appData.stores.push(newStore);
        selectedStoreId = newId;
      }

      saveAppData();
      closeStoreModal();
      renderStoreNav();
      renderCurrentStoreContent();

      if (isNewStore) {
        showBackupReminderToast();
      }
    }

    function deleteCurrentEditStore() {
      const editId = document.getElementById('edit-store-id').value;
      if (!editId) return;

      if (confirm("確定要刪除此店家的會員卡嗎？")) {
        appData.stores = appData.stores.filter(s => s.id !== editId);
        if (appData.stores.length > 0) {
          selectedStoreId = appData.stores[0].id;
        } else {
          selectedStoreId = null;
        }
        saveAppData();
        closeStoreModal();
        renderStoreNav();
        renderCurrentStoreContent();
      }
    }

    /* Global Settings Modal Functions (Store List, Reordering, Backup/Restore) */
    function openSettingsModal() {
      renderSettingsStoreList();
      document.getElementById('settings-modal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    // Render the store list inside the Settings modal, with reorder/edit/delete controls
    function renderSettingsStoreList() {
      const listContainer = document.getElementById('settings-store-list');
      if (!listContainer) return;

      listContainer.innerHTML = '';

      appData.stores.forEach((store, index) => {
        const row = document.createElement('div');
        row.className = 'bg-white rounded-xl border border-[#4A4A47]/30 p-2 flex items-center gap-2';

        row.innerHTML = `
          <div class="flex flex-col gap-0.5">
            <button type="button" class="w-6 h-6 flex items-center justify-center rounded bg-[#E5E1D6] text-[#4A4A47] hover:bg-[#4A4A47] hover:text-white disabled:opacity-30 disabled:pointer-events-none" ${index === 0 ? 'disabled' : ''}>
              <i class="fa-solid fa-chevron-up text-[10px]"></i>
            </button>
            <button type="button" class="w-6 h-6 flex items-center justify-center rounded bg-[#E5E1D6] text-[#4A4A47] hover:bg-[#4A4A47] hover:text-white disabled:opacity-30 disabled:pointer-events-none" ${index === appData.stores.length - 1 ? 'disabled' : ''}>
              <i class="fa-solid fa-chevron-down text-[10px]"></i>
            </button>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-xs font-bold text-[#4A4A47] truncate">${store.storeName}</p>
            <p class="text-[10px] text-[#4A4A47]/70 font-mono truncate">${store.barcodeValue || '(尚未設定條碼)'}</p>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button type="button" class="w-7 h-7 flex items-center justify-center rounded-lg bg-[#E5E1D6] text-[#4A4A47] hover:bg-[#4A4A47] hover:text-white">
              <i class="fa-solid fa-pen text-xs"></i>
            </button>
            <button type="button" class="w-7 h-7 flex items-center justify-center rounded-lg bg-red-100 text-red-700 hover:bg-red-200">
              <i class="fa-solid fa-trash text-xs"></i>
            </button>
          </div>
        `;

        const [upBtn, downBtn] = row.querySelectorAll('.flex-col button');
        const [editBtn, deleteBtn] = row.querySelectorAll('.flex.items-center.gap-1.shrink-0 button');

        upBtn.onclick = () => moveStoreInSettings(store.id, -1);
        downBtn.onclick = () => moveStoreInSettings(store.id, 1);
        editBtn.onclick = () => { closeSettingsModal(); openStoreManageModal(store.id); };
        deleteBtn.onclick = () => deleteStoreFromSettings(store.id);

        listContainer.appendChild(row);
      });
    }

    // Swap a store's position with its neighbor (direction: -1 = up, 1 = down)
    function moveStoreInSettings(storeId, direction) {
      const index = appData.stores.findIndex(s => s.id === storeId);
      const targetIndex = index + direction;
      if (index < 0 || targetIndex < 0 || targetIndex >= appData.stores.length) return;

      const stores = appData.stores;
      [stores[index], stores[targetIndex]] = [stores[targetIndex], stores[index]];

      saveAppData();
      renderSettingsStoreList();
      renderStoreNav();
    }

    // Delete a store directly from the Settings list (with confirmation)
    function deleteStoreFromSettings(storeId) {
      const store = appData.stores.find(s => s.id === storeId);
      if (!store) return;

      if (confirm(`確定要刪除「${store.storeName}」的會員卡嗎？`)) {
        appData.stores = appData.stores.filter(s => s.id !== storeId);
        if (selectedStoreId === storeId) {
          selectedStoreId = appData.stores.length > 0 ? appData.stores[0].id : null;
        }
        saveAppData();
        renderSettingsStoreList();
        renderStoreNav();
        renderCurrentStoreContent();
      }
    }

    /* JSON Backup Export & Import */
    function exportDataJSON() {
      const jsonStr = JSON.stringify(appData, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `barcode_wallet_backup_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importDataJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported && Array.isArray(imported.stores)) {
            appData = imported;
            if (appData.stores.length > 0) {
              selectedStoreId = appData.stores[0].id;
            }
            saveAppData();
            renderCarrierBarcode();
            renderStoreNav();
            renderCurrentStoreContent();
            renderSettingsStoreList();
            alert("會員卡資料成功匯入！");
            closeSettingsModal();
          } else {
            alert("JSON 格式不符");
          }
        } catch (err) {
          alert("匯入失敗，請確認檔案為正確 JSON");
        }
      };
      reader.readAsText(file);
    }

    /* File Download Helper (still used internally, e.g. data export) */
    function downloadFile(filename, text) {
      const element = document.createElement('a');
      element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
      element.setAttribute('download', filename);
      element.style.display = 'none';
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
    }

  event.waitUntil(
    caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS_TO_CACHE))
  );

    caches.keys().then((keys) => Promise.all(
      keys.map((key) => {

    ))
  );
  self.clients.claim();
});

    /* Initialize Application on Window Load */
    window.onload = function() {
      renderCarrierBarcode();
      renderStoreNav();
      renderCurrentStoreContent();

      // Register Service Worker and auto-check for updates every time the app opens
      if ('serviceWorker' in navigator) {
        try {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            reg.update(); // proactively check the server for a newer sw.js right now
          }).catch((err) => {
            console.log("Offline fallback ready (standard SW relative path checked)");
          });

          // Reload once so the page picks up the new version immediately
          let hasReloaded = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (hasReloaded) return;
            hasReloaded = true;
            window.location.reload();
          });
        } catch (e) {}
      }
    };
