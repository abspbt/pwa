<title>單價比一比</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --color-bg:#F4F0E6;
    --color-surface:#FFFFFF;
    --color-border:#E3DDCC;
    --color-border-strong:#CFC6B0;
    --color-text:#33302A;
    --color-text-muted:#948A78;
    --color-accent:#8A6D4E;
    --color-accent-soft:#EFE4D3;
    --color-danger:#A85338;
    --color-danger-soft:#F4E6DE;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    /* 數字專用字型：Inter 的 0 是乾淨的橢圓（中間沒有點／斜線），辨識度最高 */
    --font-number:'Inter', system-ui, sans-serif;
    --row-h:60px;
    --head-h:44px;
    --label-w:84px;
    --add-w:40px;
    --col-w:calc((100vw - var(--label-w) - var(--add-w)) / 3.5);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--color-bg); color:var(--color-text);
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
  }
  input, button{ font-size:16px; }

  .app{ height:100vh; height:100dvh; display:flex; flex-direction:column; }
  .view{ flex:1 1 auto; min-height:0; height:0; display:none; flex-direction:column; }
  .view.active{ display:flex; }
  /* #boards 本身不佔版面，讓裡面動態產生的每個類型 view 直接當作 .app 的 flex 子項，
     跟 #home 用同一套高度計算方式，避免巢狀容器沒有明確高度導致計算機撐爆版面 */
  #boards{ display:contents; }

  /* ================= HOME VIEW ================= */
  #home{
    align-items:center; justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    text-align:center; gap:0;
  }
  #home .home-inner{ width:100%; max-width:420px; }
  #home .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--color-accent);
    background:var(--color-accent-soft); display:inline-block;
    padding:3px 10px; border-radius:20px; margin-bottom:14px;
  }
  #home h1{
    font-family:var(--font-display); font-weight:700; font-size:26px;
    margin:0 0 6px;
  }
  #home p.desc{
    font-size:13.5px; color:var(--color-text-muted); margin:0 0 28px;
    line-height:1.5;
  }
  .cat-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
  }
  .cat-card{
    background:var(--color-surface);
    border:1.5px solid var(--color-border);
    border-radius:16px;
    padding:22px 14px 18px;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    transition:transform .12s ease, border-color .15s ease, box-shadow .15s ease;
    font-family:var(--font-body);
  }
  .cat-card:hover{
    border-color:var(--color-accent);
    box-shadow:0 6px 18px -8px rgba(138,109,78,.35);
    transform:translateY(-2px);
  }
  .cat-card:active{ transform:translateY(0) scale(.98); }
  .cat-icon{
    width:52px; height:52px; border-radius:50%;
    background:var(--color-accent-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
  }
  .cat-name{ font-weight:600; font-size:15px; }
  .cat-fields{
    font-family:var(--font-mono); font-size:10px; color:var(--color-text-muted);
    line-height:1.4;
  }
  .version-tag{
    margin-top:26px; font-family:var(--font-mono); font-size:10.5px;
    color:var(--color-text-muted); opacity:.7;
  }

  /* ================= BOARD VIEW (shared) ================= */
  .topbar{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    padding:calc(12px + env(safe-area-inset-top)) 14px 10px;
    border-bottom:1px solid var(--color-border);
  }
  .back-btn{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--color-border-strong);
    background:var(--color-surface); color:var(--color-text);
    font-size:16px; cursor:pointer; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .back-btn:hover{ background:var(--color-accent-soft); border-color:var(--color-accent); }
  .topbar h1{
    font-family:var(--font-display); font-weight:700;
    font-size:17px; letter-spacing:.2px; margin:0;
  }
  .topbar .tag{
    font-family:var(--font-mono); font-size:11px;
    color:var(--color-accent); background:var(--color-accent-soft);
    padding:2px 7px; border-radius:20px; font-weight:600; white-space:nowrap;
  }
  .topbar .sub{
    margin-left:auto; font-size:11.5px; color:var(--color-text-muted);
    font-family:var(--font-mono); white-space:nowrap;
  }

  .board{ flex:0 0 auto; display:flex; min-height:0; overflow:hidden; }

  .labels{
    flex:0 0 var(--label-w); width:var(--label-w);
    border-right:1px solid var(--color-border-strong);
    background:var(--color-surface);
    display:grid; grid-template-rows:var(--head-h) repeat(5, var(--row-h));
    position:relative; z-index:2;
    box-shadow:2px 0 6px -4px rgba(0,0,0,.15);
  }
  .labels .cell{
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding:4px 6px; border-bottom:1px solid var(--color-border);
  }
  .labels .cell.head{
    color:var(--color-text-muted); font-family:var(--font-mono);
    font-size:11px; letter-spacing:.02em;
  }
  .labels .cell .label-main{
    font-size:15px; font-weight:700; line-height:1.2;
    white-space:nowrap; overflow:hidden; max-width:100%;
  }

  .scroll-wrap{ flex:1 1 auto; min-width:0; position:relative; }
  .scroll-area{ height:100%; display:flex; overflow-x:auto; overflow-y:hidden; scroll-behavior:smooth; }
  .scroll-area::-webkit-scrollbar{ height:6px; }
  .scroll-area::-webkit-scrollbar-thumb{ background:var(--color-border-strong); border-radius:4px; }
  .scroll-area::-webkit-scrollbar-track{ background:transparent; }

  .fade{ position:absolute; top:0; bottom:0; width:18px; pointer-events:none; z-index:1; }
  .fade.left{ left:0; background:linear-gradient(to right, rgba(244,240,230,.95), rgba(244,240,230,0)); }
  .fade.right{ right:0; background:linear-gradient(to left, rgba(244,240,230,.95), rgba(244,240,230,0)); }

  .empty-hint{
    display:flex; align-items:center; justify-content:center;
    flex:1; color:var(--color-text-muted); font-size:13px; padding:0 16px;
  }

  .col{
    flex:0 0 var(--col-w); width:var(--col-w);
    display:grid; grid-template-rows:var(--head-h) repeat(5, var(--row-h));
    border-right:1px solid var(--color-border);
    background:var(--color-surface);
    position:relative;
    transition:box-shadow .25s ease, border-color .25s ease;
  }
  .col.best{ box-shadow:inset 0 0 0 2px var(--color-accent); z-index:1; }

  .col .head{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 4px 0 6px; border-bottom:1px solid var(--color-border);
  }
  .col .head .idx{
    font-family:var(--font-mono); font-size:11px; color:var(--color-text-muted);
    display:flex; align-items:center; gap:5px;
  }
  .col.best .head .idx{ color:var(--color-accent); font-weight:600; }
  .badge-best{
    font-size:12px; line-height:1; color:var(--color-accent);
  }
  .del-btn{
    width:20px; height:20px; border-radius:6px; border:none;
    background:transparent; color:var(--color-text-muted);
    font-size:13px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, color .15s;
  }
  .del-btn:hover{ background:var(--color-danger-soft); color:var(--color-danger); }

  .col .cell{
    display:flex; align-items:center; justify-content:center;
    padding:6px 6px; border-bottom:1px solid var(--color-border);
  }
  .col input{
    width:100%; height:36px;
    border:1px solid var(--color-border-strong);
    border-radius:8px; background:var(--color-bg);
    font-family:var(--font-number); font-size:16px; font-weight:600;
    font-variant-numeric:tabular-nums;
    color:var(--color-text); text-align:center; padding:0 4px;
    -moz-appearance:textfield; touch-action:manipulation;
  }
  .col input::-webkit-outer-spin-button,
  .col input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .col input:focus{
    outline:none; border-color:var(--color-accent);
    box-shadow:0 0 0 3px var(--color-accent-soft);
  }
  .col input::placeholder{ color:#C9BFA9; font-weight:500; }

  .result{ font-family:var(--font-number); font-size:14px; font-weight:600; color:var(--color-text-muted); font-variant-numeric:tabular-nums; }
  .result.filled{ color:var(--color-text); }
  .result .unit{ display:block; font-size:9.5px; color:var(--color-text-muted); font-weight:500; margin-top:1px; }
  .cell.per-base .result{ font-size:14.5px; text-align:center; }
  .col.best .cell.per-base .result{ color:var(--color-accent); }
  .col.best .cell.per-base{ background:var(--color-accent-soft); }

  .add-col{
    flex:0 0 var(--add-w); width:var(--add-w);
    display:flex; align-items:center; justify-content:center;
    background:var(--color-bg); border-left:1px solid var(--color-border);
  }
  .add-btn{
    width:32px; height:32px; border-radius:9px;
    border:1.5px dashed var(--color-border-strong);
    background:var(--color-surface); color:var(--color-accent);
    font-size:18px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease, border-color .15s, background .15s;
  }
  .add-btn:hover{ border-color:var(--color-accent); background:var(--color-accent-soft); }
  .add-btn:active{ transform:scale(.92); }

  /* ================= CALCULATOR ================= */
  .calc-wrap{
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column;
    border-top:1px solid var(--color-border);
    background:var(--color-bg);
  }
  .calc-display{
    flex:0 0 auto;
    margin:10px 16px 8px;
    padding:4px 18px;
    height:72px;
    display:flex; align-items:center; gap:8px;
    background:var(--color-surface);
    border:1px solid var(--color-border);
    border-radius:20px;
    box-shadow:0 1px 3px rgba(51,48,42,.06);
  }
  /* 算式（例如「208 ÷」）跟數字同一行靠左放，不另外佔用高度 */
  .calc-display .calc-expr{
    flex:0 0 auto;
    font-family:var(--font-number); font-size:12px; font-weight:500;
    color:var(--color-text-muted);
    white-space:nowrap; overflow:hidden; max-width:38%;
  }
  /* 收緊行高讓數字幾乎撐滿整個框；字級再由 JS 依實際位數自動縮放，位數少就放到最大 */
  .calc-display .calc-value{
    flex:1 1 auto; min-width:0;
    font-family:var(--font-number); font-weight:700;
    font-size:var(--calc-font-size, 59px); line-height:.78;
    letter-spacing:.5px;
    color:var(--color-text);
    text-align:right;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }

  /* 按鍵靠 grid 的彈性列/欄自動撐滿剩餘空間，不設固定比例／尺寸，
     所以無論裝置螢幕多高多矮都一定完整顯示、不會被裁掉 */
  .calc-grid{
    flex:1 1 auto; min-height:0;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-template-rows:repeat(5, minmax(0,1fr));
    gap:10px;
    padding:4px 14px calc(14px + env(safe-area-inset-bottom));
  }
  .calc-btn{
    width:100%; height:100%; min-width:0; min-height:0;
    border:none;
    border-radius:18px;
    background:var(--color-accent-soft);
    color:var(--color-text);
    font-family:var(--font-number);
    font-size:clamp(24px, 6.6vw, 33px); font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    touch-action:manipulation;
    box-shadow:0 3px 6px rgba(51,48,42,.12), 0 1px 2px rgba(51,48,42,.08);
    transition:transform .08s ease, box-shadow .12s ease;
  }
  .calc-btn:active{ transform:scale(.94); box-shadow:0 1px 2px rgba(51,48,42,.08); }
  .calc-btn.calc-func{ font-size:clamp(18px, 4.8vw, 23px); color:var(--color-text-muted); }
  .calc-btn.calc-op{ font-size:clamp(26px, 7.3vw, 35px); }
  .calc-btn.calc-equals{ font-size:clamp(25px, 6.8vw, 33px); }
  .calc-btn.calc-zero{ grid-column:span 2; }

  @media (max-width:380px){
    :root{ --label-w:74px; --add-w:36px; --row-h:56px; }
    .col input{ padding:0 2px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ HOME ============ -->
  <div class="view active" id="home">
    <div class="home-inner">
      <span class="eyebrow">單價比一比</span>
      <h1>要比較哪一種商品？</h1>
      <p class="desc">選好類型後，直接輸入賣場標示的總價與規格，馬上看出每單位最划算的選擇。</p>
      <div class="cat-grid" id="catGrid"></div>
      <div class="version-tag" id="versionTag"></div>
    </div>
  </div>

  <!-- board views are injected here by JS, one per category -->
  <div id="boards"></div>

</div>

<script>
(function(){

  // ---- 類型設定：以後要新增品項比價，只要在這裡加一組設定即可 ----
  const CATEGORIES = [
    {
      key:'water',
      name:'瓶裝飲品',
      icon:'💧',
      unitTag:'NT$ / ml',
      fieldsHint:'總價 · 容量 · 瓶數',
      fields:[
        { key:'total', label:'總價', placeholder:'199', step:'0.01', mode:'decimal' },
        { key:'base',  label:'容量', placeholder:'600', step:'1',    mode:'decimal' },
        { key:'count', label:'瓶數', placeholder:'24',  step:'1',    mode:'numeric' }
      ],
      out1:{ label:'單瓶價格' },
      out2:{ label:'每 ml 價格', unit:'/ml' }
    },
    {
      key:'tissue',
      name:'衛生紙',
      icon:'🧻',
      unitTag:'NT$ / 抽',
      fieldsHint:'總價 · 抽數 · 包數',
      fields:[
        { key:'total', label:'總價', placeholder:'299', step:'0.01', mode:'decimal' },
        { key:'base',  label:'抽數', placeholder:'100', step:'1',    mode:'numeric' },
        { key:'count', label:'包數', placeholder:'6',   step:'1',    mode:'numeric' }
      ],
      out1:{ label:'單包價格' },
      out2:{ label:'每抽價格', unit:'/抽' }
    }
  ];

  const homeView = document.getElementById('home');
  const catGrid = document.getElementById('catGrid');
  const boardsHost = document.getElementById('boards');

  function fmtMoney(n){ return isFinite(n) ? n.toFixed(2) : '--'; }
  function fmtPerBase(n){
    if(!isFinite(n)) return '--';
    return n >= 1 ? n.toFixed(3) : n.toFixed(4);
  }

  function showView(el){
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    el.classList.add('active');
  }

  // 讓說明欄的文字在固定欄寬下，自動縮小字級到剛好一行顯示完（不換行）
  function fitLabelTexts(view){
    const els = view.querySelectorAll('.labels .label-main');
    els.forEach(el => {
      let size = 15;
      el.style.fontSize = size + 'px';
      while(el.scrollWidth > el.clientWidth + 0.5 && size > 9){
        size -= 0.5;
        el.style.fontSize = size + 'px';
      }
    });
  }

  // 通用四則運算計算機：每個類型（board）各自掛一份、狀態互不共用
  function buildCalculator(mountEl){
    const KEYS = [
      { label:'AC', type:'ac',   cls:'calc-func' },
      { label:'⌫', type:'backspace', cls:'calc-func' },
      { label:'%', type:'percent', cls:'calc-func' },
      { label:'÷', type:'op', op:'/', cls:'calc-op' },
      { label:'7', type:'digit' }, { label:'8', type:'digit' }, { label:'9', type:'digit' },
      { label:'×', type:'op', op:'*', cls:'calc-op' },
      { label:'4', type:'digit' }, { label:'5', type:'digit' }, { label:'6', type:'digit' },
      { label:'−', type:'op', op:'-', cls:'calc-op' },
      { label:'1', type:'digit' }, { label:'2', type:'digit' }, { label:'3', type:'digit' },
      { label:'+', type:'op', op:'+', cls:'calc-op' },
      { label:'0', type:'digit', cls:'calc-zero' }, { label:'.', type:'decimal' },
      { label:'=', type:'equals', cls:'calc-equals' }
    ];
    const OP_SYMBOL = { '+':'+', '-':'−', '*':'×', '/':'÷' };

    mountEl.innerHTML = `
      <div class="calc-display">
        <div class="calc-expr" data-role="calcExpr">&nbsp;</div>
        <div class="calc-value" data-role="calcValue">0</div>
      </div>
      <div class="calc-grid" data-role="calcGrid"></div>
    `;
    const exprEl = mountEl.querySelector('[data-role="calcExpr"]');
    const valueEl = mountEl.querySelector('[data-role="calcValue"]');
    const gridEl = mountEl.querySelector('[data-role="calcGrid"]');

    let display = '0';
    let prevValue = null;
    let operator = null;
    let waitingForNewInput = false;
    let displayIsResult = false; // display 是計算結果（可依寬度調整小數位數），而非使用者逐鍵輸入的數字

    function formatNumber(n){
      if(!isFinite(n)) return 'ERR';
      return parseFloat(n.toPrecision(10)).toString();
    }

    // 只捨去小數位、絕不動整數部分（1234.5678 最多變成 1235，不會變成 1230）
    function formatWithDecimals(n, decimals){
      if(!isFinite(n)) return 'ERR';
      return parseFloat(n.toFixed(decimals)).toString();
    }

    function compute(a, b, op){
      if(op === '+') return a + b;
      if(op === '-') return a - b;
      if(op === '*') return a * b;
      if(op === '/') return b === 0 ? NaN : a / b;
      return b;
    }

    // 數字一律先用最大字級；放不下時「先減少小數位數」而不是縮字，
    // 讓常見的計算結果都能維持大而好讀的字級（真的還是太長才退而縮小字級）
    const FONT_MAX = 59, FONT_MIN = 24, DECIMALS_MAX = 8;
    function overflows(){ return valueEl.scrollWidth > valueEl.clientWidth + 0.5; }

    function fitValueText(){
      valueEl.style.setProperty('--calc-font-size', FONT_MAX + 'px');

      // 只有「算出來的結果」可以減少位數；使用者自己按進去的數字要原樣保留
      if(displayIsResult && display !== 'ERR'){
        const n = parseFloat(display);
        if(isFinite(n)){
          for(let d = DECIMALS_MAX; d >= 0; d--){
            const text = formatWithDecimals(n, d);
            valueEl.textContent = text;
            display = text;
            if(!overflows()) break;
          }
        }
      }

      let size = FONT_MAX;
      while(overflows() && size > FONT_MIN){
        size -= 2;
        valueEl.style.setProperty('--calc-font-size', size + 'px');
      }
    }

    function render(){
      valueEl.textContent = display === 'ERR' ? '錯誤' : display;
      exprEl.textContent = (prevValue !== null && operator)
        ? (formatNumber(prevValue) + ' ' + OP_SYMBOL[operator])
        : ' ';
      fitValueText();
    }

    // 字型載入完成／畫面寬度改變後，重新算一次最合適的字級
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitValueText);
    window.addEventListener('resize', fitValueText);

    function reset(){
      display = '0'; prevValue = null; operator = null; waitingForNewInput = false; displayIsResult = false;
      render();
    }

    function inputDigit(d){
      if(display === 'ERR' || waitingForNewInput){ display = d; waitingForNewInput = false; }
      else{ display = (display === '0') ? d : display + d; }
      displayIsResult = false;
      render();
    }

    function inputDecimal(){
      if(display === 'ERR' || waitingForNewInput){ display = '0.'; waitingForNewInput = false; displayIsResult = false; return render(); }
      if(!display.includes('.')) display += '.';
      displayIsResult = false;
      render();
    }

    function inputBackspace(){
      if(display === 'ERR'){ reset(); return; }
      waitingForNewInput = false;
      display = display.length > 1 ? display.slice(0, -1) : '0';
      if(display === '-') display = '0';
      displayIsResult = false;
      render();
    }

    function inputPercent(){
      if(display === 'ERR') return;
      display = formatNumber(parseFloat(display) / 100);
      displayIsResult = true;
      render();
    }

    function inputOperator(op){
      if(display === 'ERR') return;
      const current = parseFloat(display);
      if(prevValue !== null && operator && !waitingForNewInput){
        prevValue = compute(prevValue, current, operator);
        display = formatNumber(prevValue);
        displayIsResult = true;
      } else {
        prevValue = current;
      }
      operator = op;
      waitingForNewInput = true;
      render();
    }

    function inputEquals(){
      if(display === 'ERR' || operator === null || prevValue === null) return;
      const result = compute(prevValue, parseFloat(display), operator);
      display = formatNumber(result);
      prevValue = null; operator = null; waitingForNewInput = true; displayIsResult = true;
      render();
    }

    KEYS.forEach(key => {
      const btn = document.createElement('button');
      btn.className = 'calc-btn' + (key.cls ? ' ' + key.cls : '');
      btn.type = 'button';
      btn.textContent = key.label;
      btn.addEventListener('click', () => {
        if(key.type === 'digit') inputDigit(key.label);
        else if(key.type === 'decimal') inputDecimal();
        else if(key.type === 'ac') reset();
        else if(key.type === 'backspace') inputBackspace();
        else if(key.type === 'percent') inputPercent();
        else if(key.type === 'op') inputOperator(key.op);
        else if(key.type === 'equals') inputEquals();
      });
      gridEl.appendChild(btn);
    });

    render();
  }

  function buildBoard(cat){
    const view = document.createElement('div');
    view.className = 'view';
    view.id = 'board-' + cat.key;
    view.innerHTML = `
      <div class="topbar">
        <button class="back-btn" aria-label="返回選單">←</button>
        <h1>${cat.name}比一比</h1>
        <span class="tag">${cat.unitTag}</span>
        <span class="sub" data-role="count">1 個品項</span>
      </div>
      <div class="board">
        <div class="labels">
          <div class="cell head">品項</div>
          <div class="cell"><div class="label-main">${cat.fields[0].label}</div></div>
          <div class="cell"><div class="label-main">${cat.fields[1].label}</div></div>
          <div class="cell"><div class="label-main">${cat.fields[2].label}</div></div>
          <div class="cell"><div class="label-main">${cat.out1.label}</div></div>
          <div class="cell"><div class="label-main">${cat.out2.label}</div></div>
        </div>
        <div class="scroll-wrap">
          <div class="scroll-area" data-role="scrollArea"></div>
          <div class="fade left" style="opacity:0"></div>
          <div class="fade right" style="opacity:0"></div>
        </div>
        <div class="add-col"><button class="add-btn" aria-label="新增品項">+</button></div>
      </div>
      <div class="calc-wrap" data-role="calcWrap"></div>
    `;
    boardsHost.appendChild(view);

    buildCalculator(view.querySelector('[data-role="calcWrap"]'));

    const scrollArea = view.querySelector('[data-role="scrollArea"]');
    const addBtn = view.querySelector('.add-btn');
    const backBtn = view.querySelector('.back-btn');
    const countInfo = view.querySelector('[data-role="count"]');
    const fadeLeft = view.querySelector('.fade.left');
    const fadeRight = view.querySelector('.fade.right');

    const state = { items:[], seq:0 };

    function updateCountInfo(){ countInfo.textContent = state.items.length + ' 個品項'; }

    function renderEmptyState(){
      let hint = scrollArea.querySelector('.empty-hint');
      if(state.items.length === 0){
        if(!hint){
          hint = document.createElement('div');
          hint.className = 'empty-hint';
          hint.textContent = '目前沒有品項，點右側「+」開始比價';
          scrollArea.appendChild(hint);
        }
      } else if(hint){ hint.remove(); }
    }

    function recalcAll(){
      const rows = [];
      state.items.forEach(item => {
        const el = item.el;
        const total = parseFloat(el.querySelector('[data-field="total"]').value);
        const base  = parseFloat(el.querySelector('[data-field="base"]').value);
        const count = parseFloat(el.querySelector('[data-field="count"]').value);

        const out1El = el.querySelector('[data-out="out1"]');
        const out2El = el.querySelector('[data-out="out2"]');

        let perUnit = NaN, perBase = NaN;
        if(isFinite(total) && isFinite(count) && count > 0){ perUnit = total / count; }
        if(isFinite(perUnit) && isFinite(base) && base > 0){ perBase = perUnit / base; }

        out1El.textContent = isFinite(perUnit) ? ('$' + fmtMoney(perUnit)) : '--';
        out1El.classList.toggle('filled', isFinite(perUnit));

        out2El.innerHTML = isFinite(perBase) ? ('$' + fmtPerBase(perBase) + '<span class="unit">' + cat.out2.unit + '</span>') : '--';
        out2El.classList.toggle('filled', isFinite(perBase));

        // 用「顯示出來的精度」四捨五入後再比較，避免浮點數誤差把同價位誤判成不同價
        const rounded = isFinite(perBase) ? Number(fmtPerBase(perBase)) : NaN;
        rows.push({ id:item.id, el, perBase, rounded });
      });

      const validRounded = rows.map(r => r.rounded).filter(v => isFinite(v));
      const minValue = validRounded.length ? Math.min(...validRounded) : null;

      rows.forEach(r => {
        const isBest = minValue !== null && r.rounded === minValue && validRounded.length > 1;
        r.el.classList.toggle('best', !!isBest);
        r.el.querySelector('.badge-best').style.display = isBest ? 'inline-block' : 'none';
      });
    }

    function updateFades(){
      const max = scrollArea.scrollWidth - scrollArea.clientWidth;
      fadeLeft.style.opacity = scrollArea.scrollLeft > 4 ? '1' : '0';
      fadeRight.style.opacity = (max - scrollArea.scrollLeft > 4) ? '1' : '0';
    }

    function createColumn(){
      const id = ++state.seq;
      const wrap = document.createElement('div');
      wrap.className = 'col';
      wrap.dataset.id = id;
      wrap.innerHTML = `
        <div class="head">
          <span class="idx">#${id}<span class="badge-best" style="display:none" title="最划算">★</span></span>
          <button class="del-btn" aria-label="刪除此品項">✕</button>
        </div>
        <div class="cell"><input type="number" inputmode="${cat.fields[0].mode}" min="0" step="${cat.fields[0].step}" placeholder="${cat.fields[0].placeholder}" data-field="total"></div>
        <div class="cell"><input type="number" inputmode="${cat.fields[1].mode}" min="0" step="${cat.fields[1].step}" placeholder="${cat.fields[1].placeholder}" data-field="base"></div>
        <div class="cell"><input type="number" inputmode="${cat.fields[2].mode}" min="1" step="${cat.fields[2].step}" placeholder="${cat.fields[2].placeholder}" data-field="count"></div>
        <div class="cell"><span class="result" data-out="out1">--</span></div>
        <div class="cell per-base"><span class="result" data-out="out2">--<span class="unit">${cat.out2.unit}</span></span></div>
      `;
      scrollArea.appendChild(wrap);

      wrap.querySelectorAll('input').forEach(inp => inp.addEventListener('input', recalcAll));
      wrap.querySelector('.del-btn').addEventListener('click', () => {
        state.items = state.items.filter(it => it.id !== id);
        wrap.remove();
        updateCountInfo();
        recalcAll();
        renderEmptyState();
        updateFades();
      });

      state.items.push({ id, el: wrap });
      updateCountInfo();
      renderEmptyState();
      return wrap;
    }

    addBtn.addEventListener('click', () => {
      const col = createColumn();
      requestAnimationFrame(() => {
        scrollArea.scrollLeft = scrollArea.scrollWidth;
        updateFades();
        const firstInput = col.querySelector('input');
        if(firstInput) firstInput.focus();
      });
    });

    backBtn.addEventListener('click', () => showView(homeView));
    scrollArea.addEventListener('scroll', updateFades);
    window.addEventListener('resize', updateFades);

    // initial column
    createColumn();
    recalcAll();
    updateFades();

    return view;
  }

  const builtViews = {};

  CATEGORIES.forEach(cat => {
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.innerHTML = `
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-name">${cat.name}</div>
      <div class="cat-fields">${cat.fieldsHint}</div>
    `;
    card.addEventListener('click', () => {
      if(!builtViews[cat.key]){
        builtViews[cat.key] = buildBoard(cat);
      }
      showView(builtViews[cat.key]);
      fitLabelTexts(builtViews[cat.key]);
      if(document.fonts && document.fonts.ready){
        document.fonts.ready.then(() => fitLabelTexts(builtViews[cat.key]));
      }
    });
    catGrid.appendChild(card);
  });

  const versionTag = document.getElementById('versionTag');
  if(versionTag){
    const v = document.querySelector('meta[name="app-version"]');
    versionTag.textContent = v ? ('版本 ' + v.content) : '';
  }

})();
</script>

<script>
// ============ PWA 強制更新機制 ============
// 每次開啟這個網頁／App，都會主動向伺服器確認是否有新版本；
// 一旦偵測到新版本，會自動套用並重新整理，不需要使用者手動清除快取。
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      // 主動檢查一次是否有新版 sw.js（略過瀏覽器預設的節流延遲）
      reg.update();

      // 每次切回這個分頁，也再檢查一次
      document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible') reg.update();
      });

    }).catch(() => { /* 離線或不支援時安靜失敗，不影響一般使用 */ });

    // 新的 Service Worker 一旦接管頁面，代表已經是新版本 → 自動重新整理
    let refreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(refreshed) return;
      refreshed = true;
      window.location.reload();
    });
  });
}
</script>
